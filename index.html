try{const q=JSON.parse(localStorage.getItem('damp')||'null');if(q&&typeof q.name=='string'){P.name=q.name.slice(0,40);P.best=D.map((_,i)=>Number.isFinite(q.best&&q.best[i])?Math.max(0,Math.min(1000,q.best[i])):null);P.sent=Number.isFinite(q.sent)?q.sent:-1}}catch(e){}
const sv=()=>{try{localStorage.setItem('dam',JSON.stringify(col));localStorage.setItem('damh',JSON.stringify(H));localStorage.setItem('damp',JSON.stringify(P))}catch(e){}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=()=>P.best.reduce((a,b)=>a+(b||0),0),allDone=()=>P.best.every(x=>x!=null);
/* ===== Google Forms: Nombre = primera pregunta, Puntaje = segunda ===== */
const FORM={url:'https://docs.google.com/forms/d/e/1FAIpQLSc7vy5aaEfLzGXMLDMFdYSwjFPpiWoV_4o6a3Y4-nBzg4nmTA/formResponse',name:'entry.996473007',score:'entry.39191037'};
let inflight=null;
function send(){const t=total();if(!allDone())return Promise.resolve(false);if(P.sent>=t)return Promise.resolve(true);
if(!/^entry\.\d+$/.test(FORM.name)||!/^entry\.\d+$/.test(FORM.score)){console.warn('Faltan los códigos entry.… del formulario (FORM.name / FORM.score).');return Promise.resolve(false)}
if(inflight&&inflight.t==t)return inflight.p;
const body=new URLSearchParams();body.append(FORM.name,P.name);body.append(FORM.score,String(t));
const p=fetch(FORM.url,{method:'POST',mode:'no-cors',keepalive:true,body}).then(()=>{P.sent=Math.max(P.sent,t);sv();return true}).catch(()=>false).then(r=>{inflight=null;return r});inflight={t,p};return p}
const pk=(key,pool,n)=>{let seen=H[key]||[],av=pool.map((_,i)=>i).filter(i=>!seen.includes(i));if(av.length<n){seen=[];av=pool.map((_,i)=>i)}const ch=sh(av).slice(0,n);H[key]=seen.concat(ch);sv();return ch.map(i=>pool[i])};
const th=(c,e)=>{app.style.background=`linear-gradient(160deg,${c},#0b1519 85%)`;app.dataset.wm=e};
let tmr;const stop=()=>clearTimeout(tmr);
const tm=(s,fn)=>{const b=$('#bar');if(!b)return;stop();b.style.transition='none';b.style.width='100%';b.offsetWidth;b.style.transition='width '+s+'s linear';b.style.width='0';tmr=setTimeout(fn,s*1000)};
const st=h=>$('#st').innerHTML=h,E=(sc,done,p,m)=>{stop();p=Math.max(0,Math.round(p));$('#st').insertAdjacentHTML('beforeend',`<div class="card">${m} <b>${p<0?'−':'+'}${Math.abs(p)} pts</b></div>`);setTimeout(()=>done(sc+p),2000)};
function nameScreen(){stop();window.onkeydown=null;$('#back').style.display='none';th('#17465a','⚖️');
app.innerHTML=`<div class="stg"><h1>Derecho al Margen</h1><p class="sub">Un minijuego de derecho laboral · 5 puertas · hasta 5000 puntos</p><div class="card nmc"><label for="pn"><b>Escribí tu nombre</b></label><input id="pn" class="nm" type="text" maxlength="40" autocomplete="name"><p class="er" id="er" role="alert"></p><button class="btn" id="pgo">🚪 Entrar</button><small>Al terminar las 5 puertas se enviarán tu nombre y tu puntaje total a quien organiza el juego.</small></div></div>`;
const go=()=>{const v=$('#pn').value.replace(/[\u0000-\u001f\u007f]/g,'').replace(/\s+/g,' ').replace(/^[=+\-@\s]+/,'').trim().slice(0,40);if(v.length<2){$('#er').textContent='Escribí un nombre de al menos 2 letras.';return}
P={name:v,best:D.map(()=>null),sent:-1};sv();menu()};
$('#pgo').onclick=go;$('#pn').onkeydown=e=>{if(e.key=='Enter')go()};$('#pn').focus()}
function newPlayer(){if(!confirm((allDone()&&P.sent<total()?'⚠️ Tu resultado todavía NO se envió. ':'')+'¿Cambiar de jugador? Se borra el progreso guardado en este dispositivo.'))return;P={name:'',best:D.map(()=>null),sent:-1};sv();nameScreen()}
function menu(){stop();window.onkeydown=null;$('#back').style.display='none';th('#17465a','⚖️');const dn=P.best.filter(x=>x!=null).length;
app.innerHTML=`<div class="stg"><div class="hd"><span>👤 ${esc(P.name)}</span><span>Total: <b>${total()}</b> / 5000 · ${dn}/5 puertas</span></div><h1>Derecho al Margen</h1><p class="sub">Elegí una puerta. Todas dan a Tribunales.<br><small>Si repetís una puerta, cuenta tu mejor intento (máximo 1000 por puerta).</small></p><div class="doors">${D.map((d,i)=>`<button class="door" style="--c:${d.c}" data-i="${i}"><i>${d.e}</i><b>${d.n}</b><small>${P.best[i]==null?'Sin jugar':'✔ Mejor: '+P.best[i]+' / 1000'}</small></button>`).join('')}</div>${dn==5?'<button class="btn" id="vf" style="margin-top:24px">🏆 Ver resultado final</button>':''}<button class="btn lk" id="np">👤 Cambiar de jugador</button></div>`;
app.querySelectorAll('.door').forEach(b=>b.onclick=()=>run(+b.dataset.i,0,0));$('#np').onclick=newPlayer;if(dn==5)$('#vf').onclick=final}
function run(di,gi,sc){const d=D[di];if(gi>=d.g.length)return fin(di,sc);const g=d.g[gi];th(d.c,d.e);
app.innerHTML=`<div class="stg"><div class="hd"><span>${d.e} ${d.n}</span><span>Puntos: ${sc}</span></div>${g.nb?'':'<div class="bar"><div id="bar"></div></div>'}<h2>${g.h}</h2><div id="st"></div></div>`;
st(`<div class="card">${BN(d.c,g.ic)}<p>${g.i}</p><button class="btn" id="go0">▶ Empezar</button></div>`);
$('#go0').onclick=()=>({gestor,flow,whack,tamiz,ruleta})[g.t](g,sc,s=>run(di,gi+1,s))}
function gestor(g,sc,done){const cn=sh([2,2,1]),P=sh(g.pl.flatMap((p,k)=>pk('g'+k,p,cn[k]).map(x=>[x,k])));let sel=null,err=0,got=0,n=0;
st(`<div class="gz">${g.z.map((z,k)=>`<div class="zone" data-k="${k}"><div class="zi">${z[0]}</div><b>${z[1]}</b><small>${z[2]}</small><div class="slotf"></div></div>`).join('')}</div><div class="gp">${P.map(p=>`<div class="prof" data-k="${p[1]}"><span>${p[0][0]}</span><p>${p[0][1]}</p></div>`).join('')}</div><p class="fb">Arrastrá cada perfil hasta su contrato (o tocá el perfil y después el contrato). Un solo intento por perfil.</p>`);
const fb=t=>app.querySelector('.fb').textContent=t;
const place=(p,z)=>{if(p.dataset.d)return;p.dataset.d=1;p.style.pointerEvents='none';p.style.transform='';sel=null;if(p.dataset.k==z.dataset.k){got++;p.className='prof ok';z.querySelector('.slotf').appendChild(p);fb('✔ Correcto')}else{err++;p.className='prof no';fb('✖ Incorrecto. Ese perfil queda sin asignar.')}if(++n==5)E(sc,done,PT(got,5),`Perfiles bien asignados: ${got}/5.`)};
app.querySelectorAll('.zone').forEach(z=>z.onclick=()=>{if(sel)place(sel,z)});
app.querySelectorAll('.prof').forEach(p=>{let sx,sy,mv=0;p.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;mv=0;p.setPointerCapture(e.pointerId);p.classList.add('drag')};
p.onpointermove=e=>{if(!p.classList.contains('drag'))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)mv=1;p.style.transform=`translate(${dx}px,${dy}px)`};
p.onpointerup=e=>{p.classList.remove('drag');p.style.transform='';if(mv){p.style.pointerEvents='none';const el=document.elementFromPoint(e.clientX,e.clientY);p.style.pointerEvents='';const z=el&&el.closest('.zone');if(z)place(p,z)}else{app.querySelectorAll('.prof').forEach(q=>q.classList.remove('sel'));sel=p;p.classList.add('sel')}}})}
function flow(g,sc,done){const it=pk('sm',g.it,5);let i=0,ok=0;
const nx=()=>{if(i>=it.length)return E(sc,done,PT(ok,5),'Fin del turno.');const [x,a]=it[i];
st(`<div class="semw"><div class="tl"><u id="lr"></u><u id="lg"></u></div><div><div class="card"><span class="n">${i+1}/${it.length}</span> ${x}</div><div class="o r2 ans"><button class="gr">🟢 Legal</button><button class="rd">🔴 Ilegal</button></div></div></div><p class="fb"></p>`);
const r=v=>{app.querySelectorAll(BS).forEach(b=>b.disabled=1);if(v==a){ok++;$('#lg').className=a==0?'g':'';$('#lr').className=a==1?'r':''}
app.querySelector('.fb').textContent=v==a?'✔ Correcto':'✖ Incorrecto';i++;setTimeout(nx,1100)};
app.querySelectorAll(BS).forEach((b,k)=>b.onclick=()=>r(k))};nx()}
function whack(g,sc,done){const seq=sh([...pk('wt',g.tt,3).map(x=>[x,1]),...pk('wf',g.ff,2).map(x=>[x,0])]);let right=0,res=0,i=0,fin=0;
st(`<div class="wk">${[0,1,2,3].map(k=>`<button class="hole" aria-label="Agujero ${k+1}"><div class="mole"><div class="sign"></div><div class="face">🐹</div></div><div class="dirt"></div></button>`).join('')}</div><p class="fb">Golpeá solo los carteles verdaderos. Son 5 carteles en total.</p>`);
const hs=[...app.querySelectorAll('.hole')],fb=t=>app.querySelector('.fb').textContent=t;
const end=()=>{if(fin)return;fin=1;stop();hs.forEach(h=>{h.disabled=1;h.classList.remove('up')});E(sc,done,right*200,`Respuestas correctas: ${right}/5.`)};
const solve=(h,ok,m)=>{if(fin||h.dataset.r==1)return;h.dataset.r=1;res++;if(ok)right++;fb(m);h.classList.remove('up');if(res==5)tmr=setTimeout(end,700)};
const pop=()=>{if(fin||i>=seq.length)return;const fr=hs.filter(h=>!h.classList.contains('up'));if(!fr.length){setTimeout(pop,300);return}const h=fr[Math.floor(Math.random()*fr.length)],[s,tr]=seq[i++];
h.querySelector('.sign').textContent=s;h.querySelector('.face').textContent=Math.random()<.2?'🥸':'🐹';h.dataset.t=tr;h.dataset.r=0;h.classList.add('up');setTimeout(()=>{if(h.dataset.r==0)solve(h,!tr,tr?'✖ Dejaste pasar un cartel verdadero.':'✔ Bien: ese era falso.')},g.up);setTimeout(pop,g.gap)};
hs.forEach(h=>h.onclick=()=>{if(fin||!h.classList.contains('up')||h.dataset.r==1)return;h.classList.add('bonk');setTimeout(()=>h.classList.remove('bonk'),280);solve(h,+h.dataset.t==1,+h.dataset.t?'✔ ¡Verdadero!':'✖ Ese cartel era falso.')});
tm(g.time,end);pop()}
function tamiz(g,sc,done){const nP=Math.random()<.5?2:3,it=sh([...pk('tp',g.pm,nP).map(x=>[x,0]),...pk('tf',g.fr,5-nP).map(x=>[x,1])]);let sel=-1,got=0,err=0,n=0;
st(`<div class="bub">${it.map((x,k)=>`<button data-k="${k}">${x[0]}</button>`).join('')}</div><div class="o bins"><button data-b="0">🧺 Pasantía educativa</button><button data-b="1">🗑️ Fraude laboral</button></div><p class="fb">Tocá una burbuja y después su cesto.</p>`);
const bs=[...app.querySelectorAll('.bub button')];bs.forEach(b=>b.onclick=()=>{bs.forEach(c=>c.classList.remove('sel'));sel=+b.dataset.k;b.classList.add('sel')});
app.querySelectorAll('.bins button').forEach(c=>c.onclick=()=>{if(sel<0)return;const b=bs[sel],ok=it[sel][1]==+c.dataset.b;b.disabled=1;b.classList.remove('sel');b.classList.add(ok?'ok':'no');if(ok)got++;else err++;sel=-1;if(++n==it.length)E(sc,done,PT(got,5),`Aciertos: ${n-err}/${n}.`)})}
function ruleta(g,sc,done){let n=0,got=0,run=0;const N=g.s.length,cs=['#1f6f8b','#d99a1b','#a33b2e','#2f7a4f','#6a3d8f','#8a5a14','#3f6e9a'],ks=pk('rl',g.s.map((_,i)=>i),5);
const wh=`<div class="wrap"><div class="whl" id="wh" style="background:conic-gradient(${g.s.map((x,k)=>`${cs[k%7]} ${k*100/N}% ${(k+1)*100/N}%`).join(',')})">${g.s.map((x,k)=>`<span style="transform:rotate(${(k+.5)*360/N}deg) translateY(-84px)">${x[0]}</span>`).join('')}</div><div class="ptr">▼</div></div>`;
const sp=()=>{if(n>=5)return E(sc,done,PT(got,5),got==5?'¡Las 5 bien! Premio máximo.':`Aciertos: ${got}/5.`);
st(`${wh}<button class="btn" id="sp">🎰 Girar (${n+1}/5)</button><p class="fb">Aciertos: ${got}</p>`);
$('#sp').onclick=()=>{$('#sp').disabled=1;const k=ks[n],w=$('#wh');w.offsetWidth;w.style.transition='transform 3s cubic-bezier(.15,.7,.2,1)';w.style.transform=`rotate(${1800+360-(k+.5)*360/N}deg)`;
tmr=setTimeout(()=>{const s=g.s[k];st(`<div class="card"><div style="font-size:3rem">${s[0]}</div><b>${s[1]}</b><div class="o r2 ans"><button data-v="1">💸 Se paga</button><button data-v="0">🚫 Se rechaza</button></div><p class="fb" style="color:var(--mut)"></p></div>`);
app.querySelectorAll(BS).forEach(b=>b.onclick=()=>{app.querySelectorAll(BS).forEach(c=>c.disabled=1);const ok=+b.dataset.v==s[2];b.classList.add(ok?'ok':'no');if(ok)got++;app.querySelector('.fb').textContent=ok?s[3]:'✖ Incorrecto.';n++;tmr=setTimeout(sp,1900)})},3100)}};sp()}
function fin(di,sc){stop();sc=Math.max(0,Math.min(1000,Math.round(sc)));const x=sc>=1000?0:sc>=800?1:sc>=600?2:sc>=300?3:4,[em,ti,ds,jk]=D[di].f[x].split('|');col['d'+di+'f'+x]=1;P.best[di]=P.best[di]==null?sc:Math.max(P.best[di],sc);sv();const all=allDone();th(D[di].c,D[di].e);
app.innerHTML=`<div class="stg"><div class="fin">${SC(x,PR[di][x])}<span class="tag" style="background:${LC[x]}">${em} ${L[x]} · ${sc} pts</span><h2>${ti}</h2><p class="pr">${ds}</p><p class="jk">${jk}</p><p class="tt">Mejor de esta puerta: ${P.best[di]} / 1000 · Total acumulado: ${total()} / 5000</p>${all?'<button class="btn" id="vf">🏆 Ver resultado final</button>':''}</div></div>`;$('#back').style.display='block';if(all){send();$('#vf').onclick=final}}
function final(){stop();window.onkeydown=null;if(!allDone())return menu();$('#back').style.display='none';th('#17465a','🏆');const t=total(),when=new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});
app.innerHTML=`<div class="stg"><div class="fin"><h1>🏆 Resultado final</h1><div class="sub">Nombre: <b>${esc(P.name)}</b><br><small>${esc(when)}</small></div><div class="card big">${t}<small> / 5000</small></div><div class="card">${D.map((d,i)=>`<div class="rw"><span>${d.e} ${d.n}</span><b>${P.best[i]} / 1000</b></div>`).join('')}</div><div class="sst" id="sst">⏳ Enviando tu resultado…</div><button class="btn" id="bk">🚪 Volver a las puertas</button><button class="btn lk" id="np">👤 Nuevo jugador</button></div></div>`;
const ss=$('#sst');const upd=ok=>{if(ok){ss.className='sst s1';ss.textContent='✔ Tu resultado fue enviado.'}else{ss.className='sst s0';ss.innerHTML='⚠️ No se pudo enviar automáticamente. Revisá tu conexión y tocá «Reintentar envío».<button class="btn" id="rt">🔄 Reintentar envío</button>';$('#rt').onclick=()=>{ss.className='sst';ss.textContent='⏳ Enviando tu resultado…';send().then(upd)}}};
if(P.sent>=t)upd(true);else send().then(upd);
$('#bk').onclick=menu;$('#np').onclick=newPlayer}
window.addEventListener('beforeunload',e=>{if(allDone()&&P.sent<total()){e.preventDefault();e.returnValue=''}});
$('#back').onclick=menu;P.name?menu():nameScreen();
</script></body></html>
